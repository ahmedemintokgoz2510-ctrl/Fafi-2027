<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fafi 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1a14;--panel:#16221b;--line:#2b3a31;--chalk:#ece8dc;--muted:#97a399;--brass:#bfa56a;
    --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
    --text:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--chalk);font-family:var(--text)}
  #stage{position:fixed;inset:0;background:radial-gradient(circle at top, rgba(31,56,42,.96), rgba(15,26,20,1) 55%);}
  #stage canvas{display:block;width:100%;height:100%}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:flex}
  button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(15,26,20,.72);padding:.75em 1.4em;border-radius:6px}
  button:hover{border-color:var(--brass)}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button.primary{background:var(--chalk);color:#10201a;border-color:var(--chalk);font-weight:600}
  button.primary:hover{background:#fff}
  button.sel{border-color:var(--brass);background:rgba(191,165,106,.18)}

  /* ana menü */
  #menu{align-items:flex-end;background:linear-gradient(90deg,rgba(10,18,13,.92) 0%,rgba(10,18,13,.55) 45%,rgba(10,18,13,.05) 100%)}
  .menu-box{padding:0 0 9vh 7vw;max-width:46rem}
  .title{font-family:var(--display);font-weight:700;font-size:clamp(4.5rem,13vw,11rem);line-height:.86;letter-spacing:.01em}
  .tag{color:var(--muted);margin:1.2rem 0 2.2rem;font-size:clamp(1rem,1.6vw,1.3rem);max-width:30rem;line-height:1.5}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
  button:active{transform:scale(.97)}
  .menu-actions{display:flex;gap:1rem;flex-wrap:wrap}
  .play{min-width:12rem;min-height:3.4rem;font-family:var(--display);font-size:clamp(1.6rem,2.6vw,2.2rem);padding:.45em 2.4em;letter-spacing:.04em}
  .opts{display:flex;gap:1.6rem;align-items:center;margin-top:1.6rem;flex-wrap:wrap}
  .opts .grp{display:flex;gap:.4rem;align-items:center;color:var(--muted)}
  .opts .grp span{margin-right:.4rem}
  .opts button{padding:.5em 1em}

  /* oda / QR */
  #lobby{align-items:center;justify-content:center;background:rgba(10,18,13,.82)}
  .lobby-box{display:grid;grid-template-columns:auto 22rem;gap:3.5rem;align-items:center;padding:2.6rem 3.2rem;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  #qr{background:#ece8dc;padding:14px;border-radius:6px;width:fit-content}
  #qr img,#qr canvas{display:block}
  .lobby-box h2{font-family:var(--display);font-size:2.6rem;font-weight:600;margin-bottom:.4rem}
  .lobby-box p{color:var(--muted);line-height:1.5;margin-bottom:1.4rem}
  .code{font-family:var(--display);font-size:1.5rem;letter-spacing:.12em;color:var(--brass)}
  .slot{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-top:1px solid var(--line)}
  .slot .dot{width:.7rem;height:.7rem;border-radius:50%;background:#46544b}
  .slot.in .dot{background:var(--brass)}
  .slot .who{flex:1}.slot small{color:var(--muted)}
  .chip{display:inline-block;width:1rem;height:1rem;border-radius:3px;vertical-align:-2px;margin-right:.4rem}
  #lobbyUrl{font-size:.8rem;color:var(--muted);word-break:break-all;margin-top:.7rem;max-width:18rem}
  #lobbyBack{margin-top:1.4rem}

  /* maç ekranı */
  #hud{position:fixed;top:1.4vh;left:50%;transform:translateX(-50%);display:none;align-items:stretch;
    background:rgba(12,20,15,.86);border:1px solid var(--line);border-radius:8px;font-family:var(--display);overflow:hidden}
  #hud.on{display:flex}
  #hud .t{display:flex;align-items:center;gap:.7rem;padding:.35rem 1.1rem;font-size:1.7rem;font-weight:600}
  #hud .team-meta{display:flex;flex-direction:column;justify-content:center;min-width:0}
  #hud .active-player{max-width:12rem;overflow:hidden;color:var(--muted);font-family:var(--text);font-size:.68rem;font-weight:500;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
  #hud .active-player:empty{display:none}
  #hud .t img{height:1.9rem;width:auto}
  #hud .bar{width:.45rem}
  #hud .sc{display:flex;align-items:center;gap:.8rem;padding:0 1.2rem;font-size:2.6rem;font-weight:700;background:rgba(236,232,220,.08)}
  #hud .clock{display:flex;align-items:center;padding:0 1.1rem;font-size:1.7rem;color:var(--brass);min-width:5.2rem;justify-content:center;border-left:1px solid var(--line)}
  #penDots{position:fixed;top:10.5vh;left:50%;transform:translateX(-50%);display:none;flex-direction:column;gap:.15rem;background:rgba(12,20,15,.78);border:1px solid var(--line);border-radius:6px;padding:.35rem .8rem;font-family:var(--display);font-size:1.1rem}
  #penDots.on{display:flex}
  #penDots div{display:flex;align-items:center;gap:.5rem}
  #penDots b{width:2.6rem;font-weight:600;color:var(--muted)}
  #penDots i{font-style:normal;width:1rem;text-align:center;color:var(--muted)}
  #penDots i.g{color:var(--chalk)}
  #penDots i.m{color:#a8554b}
  #sndHud{position:fixed;right:1.2vw;top:1.4vh;display:none;padding:.4em .9em;font-size:.9rem}
  #sndHud.on{display:block}
  #banner{position:fixed;left:1.5vw;right:auto;top:12vh;max-width:34vw;text-align:left;font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,2.4vw,2.4rem);line-height:1.15;
    letter-spacing:.03em;opacity:0;pointer-events:none;background:rgba(12,20,15,.72);border-left:4px solid var(--brass);border-radius:6px;padding:.35em .8em;text-shadow:0 2px 10px rgba(0,0,0,.6);transition:opacity .25s}
  #banner.on{opacity:1}
  #banner.goal{font-size:clamp(1.8rem,3.4vw,3.4rem)}
  #banner small{display:block;font-size:.42em;font-weight:500;color:var(--brass);letter-spacing:.06em}
  #end{align-items:center;justify-content:center;background:rgba(10,18,13,.82);text-align:center;flex-direction:column;gap:1.4rem}
  #end h2{font-family:var(--display);font-size:clamp(3rem,7vw,6rem);font-weight:700}
  #end .res{font-family:var(--display);font-size:clamp(2rem,4vw,3.4rem);color:var(--muted)}
  #end .row{display:flex;gap:1rem;margin-top:1rem}

  #touchPad{position:fixed;inset:0;display:none;pointer-events:none;z-index:40;touch-action:none}
  #touchPad.on{display:block}
  .tp-side{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
  .tp-side.left{left:0;border-right:1px solid rgba(236,232,220,.10)} .tp-side.right{right:0;border-left:1px solid rgba(236,232,220,.10)}
  .tp-label{position:absolute;top:7.5vh;left:2vw;font-family:var(--display);font-size:clamp(.8rem,1.4vw,1.15rem);letter-spacing:.08em;color:rgba(236,232,220,.55)}
  .tp-side.right .tp-label{left:auto;right:2vw;text-align:right}
  .tp-stick{position:absolute;width:clamp(100px,12vw,150px);height:clamp(100px,12vw,150px);bottom:5vh;border-radius:50%;border:1px solid rgba(236,232,220,.24);background:rgba(12,20,15,.28);pointer-events:auto;touch-action:none}
  .tp-side.left .tp-stick{left:4vw}.tp-side.right .tp-stick{right:4vw}
  .tp-knob{position:absolute;width:36%;height:36%;left:32%;top:32%;border-radius:50%;background:rgba(236,232,220,.55);box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none}
  .tp-actions{position:absolute;bottom:4.5vh;display:grid;grid-template-columns:repeat(3,clamp(52px,5.8vw,76px));grid-auto-rows:clamp(52px,5.8vw,76px);gap:clamp(7px,1vw,13px);pointer-events:auto}
  .tp-side.left .tp-actions{right:5vw}.tp-side.right .tp-actions{left:5vw}
  .tp-btn{border:1px solid rgba(236,232,220,.26);border-radius:50%;padding:0;background:rgba(12,20,15,.50);backdrop-filter:blur(5px);font-family:var(--display);font-size:clamp(.68rem,1.05vw,.95rem);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;color:var(--chalk);pointer-events:auto;touch-action:none}
  .tp-btn:active,.tp-btn.on{background:rgba(191,165,106,.45);border-color:var(--brass)}
  .tp-btn.shoot{grid-column:2;grid-row:2;transform:scale(1.16)} .tp-btn.pass{grid-column:1;grid-row:1}.tp-btn.through{grid-column:3;grid-row:1}.tp-btn.switch{grid-column:1;grid-row:2}.tp-btn.sprint{grid-column:3;grid-row:2}.tp-btn.pressure{grid-column:1;grid-row:3}.tp-btn.slide{grid-column:3;grid-row:3}
  #touchHint{position:absolute;bottom:1.2vh;left:50%;transform:translateX(-50%);font-size:.72rem;color:rgba(236,232,220,.45);white-space:nowrap}
  @media (max-width:800px){.tp-actions{grid-template-columns:repeat(3,52px);grid-auto-rows:52px}.tp-stick{width:105px;height:105px}.tp-btn{font-size:.62rem}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="menu" class="screen on">
  <div class="menu-box">
    <h1 class="title">FAFİ 27</h1>
    <p class="tag">Yeni saha ve oyuncular. Telefonla gamepad veya doğrudan akıllı tahtada iki oyuncu.</p>
    <div class="menu-actions">
      <button id="playBtn" class="primary play">Telefonla Oyna</button>
      <button id="touchModeBtn" class="primary play">Tahtada 2 Oyuncu</button>
      <button id="penModeBtn" class="primary play">Penaltı Atışları</button>
    </div>
    <div class="opts">
      <div class="grp"><span>Maç süresi</span><span id="durs"></span></div>
      <button id="sndBtn">Ses: Açık</button>
    </div>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="lobby-box">
    <div><div id="qr"></div><div id="lobbyUrl"></div></div>
    <div>
      <h2>Telefonla bağlan</h2>
      <p>Kamerayla QR kodu okut. Oda kodu: <span class="code" id="roomCode">----</span></p>
      <div class="slot" id="slot0"><span class="dot"></span><span class="who">Oyuncu 1</span><small>Bekleniyor</small></div>
      <div class="slot" id="slot1"><span class="dot"></span><span class="who">Oyuncu 2</span><small>Bekleniyor</small></div>
      <button id="lobbyBack">Ana menü</button>
    </div>
  </div>
</div>

<div id="hud">
  <div class="bar" id="bar0"></div><div class="t"><img id="logo0" alt="" hidden><span class="team-meta"><span id="tn0"></span><small class="active-player" id="active0"></small></span></div>
  <div class="sc"><span id="sc0">0</span><span>-</span><span id="sc1">0</span></div>
  <div class="t"><span class="team-meta"><span id="tn1"></span><small class="active-player" id="active1"></small></span><img id="logo1" alt="" hidden></div><div class="bar" id="bar1"></div>
  <div class="clock" id="clock">00:00</div>
</div>
<div id="penDots"></div>
<button id="sndHud">Ses: Açık</button>
<div id="banner"></div>


<div id="touchPad" aria-hidden="true">
  <div class="tp-side left" data-team="0"><div class="tp-label">TAKIM 1</div><div class="tp-stick"><div class="tp-knob"></div></div><div class="tp-actions">
    <button class="tp-btn pass" data-btn="pass">PAS</button><button class="tp-btn through" data-btn="through">ARA</button><button class="tp-btn switch" data-btn="switch">DEĞİŞ</button><button class="tp-btn shoot" data-btn="shoot">ŞUT</button><button class="tp-btn sprint" data-btn="sprint">KOŞ</button><button class="tp-btn pressure" data-btn="pressure">BASKI</button><button class="tp-btn slide" data-btn="slide">KAY</button>
  </div></div>
  <div class="tp-side right" data-team="1"><div class="tp-label">TAKIM 2</div><div class="tp-stick"><div class="tp-knob"></div></div><div class="tp-actions">
    <button class="tp-btn pass" data-btn="pass">PAS</button><button class="tp-btn through" data-btn="through">ARA</button><button class="tp-btn switch" data-btn="switch">DEĞİŞ</button><button class="tp-btn shoot" data-btn="shoot">ŞUT</button><button class="tp-btn sprint" data-btn="sprint">KOŞ</button><button class="tp-btn pressure" data-btn="pressure">BASKI</button><button class="tp-btn slide" data-btn="slide">KAY</button>
  </div></div><div id="touchHint">İki taraf aynı anda kullanılabilir</div>
</div>

<div id="end" class="screen">
  <h2 id="endTitle"></h2>
  <div class="res" id="endScore"></div>
  <div class="row"><button id="rematch" class="primary">Tekrar oyna</button><button id="toMenu">Ana menü</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="config.js"></script>
<script src="js/game.js?v=3"></script>
<script src="js/touch.js?v=1"></script>
<script src="js/host.js?v=4"></script>
</body>
</html>
